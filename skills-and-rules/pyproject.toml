[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfx-devkit-mcp"
version = "1.0.0rc1"
description = "Local-first FiveM developer MCP and agent plugin"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
cfx-devkit-mcp = "cfx_devkit.server:main"
cfx-devkit = "cfx_devkit.cli:main"
cfx-devkit-bridge = "cfx_devkit.devbridge:main"

[project.optional-dependencies]
analysis = ["tree-sitter==0.25.2", "tree-sitter-lua>=0.5,<0.6"]
monitoring = ["psutil>=5.9,<8"]

[tool.setuptools.packages.find]
include = ["cfx_devkit*"]

[tool.setuptools.package-data]
cfx_devkit = ["data/*.json", "_assets/**/*"]

[tool.setuptools]
include-package-data = true
