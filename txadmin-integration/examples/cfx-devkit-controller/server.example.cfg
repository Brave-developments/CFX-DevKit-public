# Only on an isolated development server. Do NOT replicate credentials via setr.
# Set the matching token in CFX_CONTROL_TOKEN on the Python broker/MCP host.
# Do not expose TCP port 8766; both processes must run on the same trusted machine.
set devkit_control_enable 1
set devkit_control_token "<PRIVATE_RANDOM_TOKEN_48_BYTES_OR_MORE>"
set devkit_control_resources "my-test-resource,another-dev-resource"
set devkit_control_actions "restart,ensure"
ensure cfx-devkit-controller
